name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: enterprise-rag-api
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/enterprise-rag-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 app/ --max-line-length 120 --exclude __pycache__

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'   # only deploy on push to main, not PRs
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Push Docker image to GCR
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --set-env-vars="GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},\
          GROQ_FALLBACK_API_KEY=${{ secrets.GROQ_FALLBACK_API_KEY }},\
          PORTKEY_API_KEY=${{ secrets.PORTKEY_API_KEY }},\
          QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }},\
          QDRANT_CLUSTER_ENDPOINT=${{ secrets.QDRANT_CLUSTER_ENDPOINT }},\
          LOGFIRE_TOKEN=${{ secrets.LOGFIRE_TOKEN }},\
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }},\
          LANGSMITH_TRACING=true,\
          LANGSMITH_PROJECT=Enterprise Rag System,\
          LANGSMITH_ENDPOINT=https://api.smith.langchain.com,\
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"

      - name: Show deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "✅ Deployed to: $URL"
